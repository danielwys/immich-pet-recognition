[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immich-pet-recognition"
version = "0.1.0"
description = "A modular, self-hosted pet recognition companion for Immich"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "numpy>=2.2,<3", "Pillow>=11,<13",
  "huggingface-hub>=0.30,<2",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2"]
cuda = ["onnxruntime-gpu>=1.21,<1.27; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
immich-pets = "immich_pet_recognition.__main__:main"

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
