name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked --extra cpu --python 3.12
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t immich-pet-recognition:test .
      - run: docker build -f Dockerfile.cuda -t immich-pet-recognition:cuda-test .
